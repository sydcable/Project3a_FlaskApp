<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Data Visulizer</title>
    <style>
        .post {
            padding: 10px;
            margin: 5px;
            background-color: #f3f3f3
        }

        .card {
            background-color: #ffff;
            text-align: left;
            content: left;
            margin: 5px;
            padding: 10px;
            
        }

        .mainContent {
            background-color: lightblue;
            margin: 0px;
            padding: 10px;
        }

        .alert {
            padding: 20px;
            margin: 5px;
            color: #970020;
            background-color: #ffd5de;
        }
    </style>
</head>
<body class="mainContent">
    <h2>Stock Data Visulizer</h2>
    <hr>
    <form method="POST">
    <div class="card">
        <label>Choose Symbol</label>
        <select id="symbol" name="symbol" required>
            <option value="">Select Symbol</option>
            {% for symbol in stocks %}
                <option value="{{ symbol }}">{{ symbol }}</option>
            {% endfor %}
        </select>
        <br>
        <label>Choose Chart Type</label>
        <select id="chart" name="chart" reqired>
            <option>Select Chart Type</option>
            <option>Bar</option>
            <option>Line</option>
        </select>
        <br>
        <label>Choose Time Series</label>
        <select id="time_series" name="time_series" reqired>
            <option>Select Time Series</option>
            <option>Intraday</option>
            <option>Daily</option>
            <option>Weekly</option>
            <option>Monthly</option>
        </select>
        <br>
        <label>Input Start Date</label>
        <input type="date" id="start_input" name="start_input" reqired>
        <br>
        <label>Input End Date</label>
        <input type="date" id="end_input" name="end_input" reqired>
        <br>
        <button type="submit">Generate Chart</button>

        {% if chart %} 
        <div class="chart-container">
            <h2>{{selected_stock}}'s Stock Data</h2>
            <embed type="image/svg+xml" src="{{ chart_svg }}" />
        </div>        
        {% endif %}

    </form>
    <div class="content">
        {% for message in get_flashed_messages() %}
            <div class="alert">{{message}}</div>
        {% endfor %}
        {% block content %} {% endblock %}
    </div>
    </div>  
</body>
</html>
